name: knowledge-workspace

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB is required}
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 12
    volumes:
      - postgres_data:/var/lib/postgresql/data
    security_opt:
      - no-new-privileges:true
    logging:
      options:
        max-size: 10m
        max-file: "3"

  api:
    image: knowledge-workspace-api:latest
    build:
      context: /opt/knowledge-workspace/apps/web-service
      dockerfile: /etc/knowledge-workspace/Dockerfile.api
    restart: unless-stopped
    environment:
      APP_ENV: production
      SECRET_KEY: ${SECRET_KEY:?SECRET_KEY is required}
      ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES:-10080}
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      CORS_ORIGINS: https://${KW_DOMAIN:-kw.darrichan.top}
      COOKIE_SECURE: "true"
      FORWARDED_ALLOW_IPS: "*"
      REGISTRATION_INVITE_CODES: ${REGISTRATION_INVITE_CODES:?REGISTRATION_INVITE_CODES is required}
      UPLOAD_DIR: /app/uploads
      UPLOAD_MAX_BYTES: ${UPLOAD_MAX_BYTES:-20971520}
      WRITE_RATE_LIMIT_PER_MINUTE: ${WRITE_RATE_LIMIT_PER_MINUTE:-120}
      TRASH_RETENTION_DAYS: ${TRASH_RETENTION_DAYS:-7}
      WECHAT_MINI_APP_ID: ${WECHAT_MINI_APP_ID:-}
      WECHAT_MINI_APP_SECRET: ${WECHAT_MINI_APP_SECRET:-}
      WECHAT_MINI_ENV_VERSION: ${WECHAT_MINI_ENV_VERSION:-release}
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/health/ready')"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 15s
    expose:
      - "8000"
    volumes:
      - uploads_data:/app/uploads
    security_opt:
      - no-new-privileges:true
    logging:
      options:
        max-size: 10m
        max-file: "5"

  web:
    image: knowledge-workspace-web:latest
    build:
      context: /opt/knowledge-workspace
      dockerfile: /etc/knowledge-workspace/Dockerfile.web
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "127.0.0.1:${KW_APP_PORT:-8081}:80"
    security_opt:
      - no-new-privileges:true
    logging:
      options:
        max-size: 10m
        max-file: "3"

volumes:
  postgres_data:
    name: kw_postgres_data
  uploads_data:
    name: kw_uploads_data
