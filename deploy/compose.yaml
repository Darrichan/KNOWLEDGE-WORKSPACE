name: zhiliu

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-zhiliu}
      POSTGRES_USER: ${POSTGRES_USER:-zhiliu}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-zhiliu-dev-password}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    ports:
      - "65432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  api:
    build:
      context: ../apps/web-service
    restart: unless-stopped
    environment:
      APP_ENV: ${APP_ENV:-development}
      SECRET_KEY: ${SECRET_KEY:-development-secret-key-change-me-please}
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-zhiliu}:${POSTGRES_PASSWORD:-zhiliu-dev-password}@db:5432/${POSTGRES_DB:-zhiliu}
      CORS_ORIGINS: http://localhost:8080,http://127.0.0.1:8080,http://localhost:5174
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      REGISTRATION_INVITE_CODES: ${REGISTRATION_INVITE_CODES:-}
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/health/live')"]
      interval: 10s
      timeout: 5s
      retries: 10
    ports:
      - "18000:8000"
    volumes:
      - uploads_data:/app/uploads

  web:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.web
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "8080:80"

volumes:
  postgres_data:
  uploads_data:
