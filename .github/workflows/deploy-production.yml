name: Deploy KW production

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/deploy-production.yml"
      - "apps/web-service/**"
      - "deploy/**"
      - "public/**"
      - "scripts/**"
      - "src/**"
      - "tests/**"
      - "worker/**"
      - "index.html"
      - "package.json"
      - "package-lock.json"
      - "vite.config.mjs"
      - "Makefile"
  workflow_dispatch:

concurrency:
  group: kw-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  verify:
    name: Build and check
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Build PC frontend
        run: npm ci && npm run build

      - name: Test frontend package
        run: npm run test:sites

      - name: Set up uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Check Python API
        working-directory: apps/web-service
        run: uv sync --frozen && uv run ruff check app

      - name: Validate production Compose
        run: |
          docker compose --env-file deploy/.env.production.example \
            -f deploy/compose.prod.yaml config --quiet
          docker compose --env-file deploy/.env.production.example \
            -f deploy/secure/compose.yaml config --quiet

  deploy:
    name: Deploy to Hong Kong server
    needs: verify
    if: github.event_name == 'workflow_dispatch' || vars.KW_AUTO_DEPLOY == 'true'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Configure SSH
        env:
          DEPLOY_KEY: ${{ secrets.KW_DEPLOY_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.KW_DEPLOY_KNOWN_HOSTS }}
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$DEPLOY_KEY" > ~/.ssh/kw_deploy
          chmod 600 ~/.ssh/kw_deploy
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Pull and deploy
        env:
          DEPLOY_HOST: ${{ secrets.KW_DEPLOY_HOST }}
          DEPLOY_PORT: ${{ secrets.KW_DEPLOY_PORT }}
          DEPLOY_USER: ${{ secrets.KW_DEPLOY_USER }}
        run: |
          ssh -i ~/.ssh/kw_deploy -p "${DEPLOY_PORT:-22}" \
            -o BatchMode=yes -o StrictHostKeyChecking=yes \
            "${DEPLOY_USER}@${DEPLOY_HOST}" \
            "KW_DEPLOY_SHA=${GITHUB_SHA} sudo -n /usr/local/sbin/deploy-kw"
